# Selects native-speaker recordings (Wiktionary/Commons) per card, filtered with Azure scoring.
# Saves progress after every card; if it runs out of time it commits what's done and starts itself again.
name: Select native recordings

# Paused: Wikimedia rate-limits downloads from GitHub's servers (HTTP 429, Retry-After 120).
# Runs only when started by hand with "run" ticked; automatic restarts are skipped.
on:
  workflow_dispatch:
    inputs:
      run:
        description: "Really run the native-recording pipeline"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: native
  cancel-in-progress: false

jobs:
  select:
    if: ${{ inputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Download, score and select
        id: select
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: japaneast
          TIME_BUDGET: "1500"
        run: python3 -u tools/fetch_native.py

      - name: Commit progress
        if: always()
        run: |
          git add audio/native qa/native-selection.md qa/native-state.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Select native recordings (${{ steps.select.outputs.finished == 'true' && 'complete' || 'progress' }})"
          git pull --rebase -q origin main
          git push

      - name: Continue in a new run
        if: steps.select.outputs.finished == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run native.yml --ref main
