# Selects native-speaker recordings (Wiktionary/Commons) per card, filtered with Azure scoring.
# Wikimedia rate-limits downloads from GitHub's servers, so the audio comes from native-raw.zip,
# downloaded in a browser on a home connection and uploaded to the repo root.
name: Select native recordings

on:
  push:
    branches: [main]
    paths: ["native-raw.zip"]
  workflow_dispatch:
    inputs:
      run:
        description: "Run without native-raw.zip (downloads directly; usually rate-limited)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: native
  cancel-in-progress: false

jobs:
  select:
    if: ${{ github.event_name == 'push' || inputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Convert, score and select
        id: select
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: japaneast
          RAW_ZIP: native-raw.zip
          TIME_BUDGET: "1800"
          DEBUG: "1"
        run: |
          rm -f qa/native-state.json
          python3 -u tools/fetch_native.py

      - name: Commit
        if: always()
        run: |
          git rm -q --ignore-unmatch native-raw.zip
          git add audio/native qa/native-selection.md qa/native-state.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Select native recordings (${{ steps.select.outputs.finished == 'true' && 'complete' || 'partial' }})"
          git pull --rebase -q origin main
          git push
